<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMPIRE Club | Flagship Nightlife</title>

  <link rel="stylesheet" href="./css/core.css">
  <link rel="stylesheet" href="./css/global.css">
</head>
<body class="lang-vi">

<!-- HEADER -->
<header class="site-header">
  <button class="menu-toggle">
    <span></span><span></span><span></span>
  </button>

  <div class="lang-switch">
    <button class="active" data-lang="vi">VI</button>
    <button data-lang="en">EN</button>
  </div>
</header>

<!-- LOGO STAGE -->
<section class="logo-stage" id="home">
  <img src="./assets/images/D653A195-74D9-4555-B2C9-3D0C6AB2F131.png" alt="EMPIRE Logo">
  <div class="divider"></div>
</section>

<!-- HERO VIDEO -->
<section class="hero">
  <video autoplay muted loop playsinline class="hero-video">
    <source src="./assets/video/hero.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <p class="hero-text" data-lang="vi">Biểu tượng nightlife cao cấp tại Sài Gòn</p>
    <p class="hero-text" data-lang="en">Saigon’s premium nightlife destination</p>

    <div class="hero-actions">
      <a href="#contact" class="btn primary">Đặt bàn</a>
      <a href="#experience" class="btn ghost">Khám phá</a>
    </div>
  </div>
</section>

<!-- ABOUT -->
<section class="about" id="experience">
  <h2>Empire Experience</h2>
  <p>
    Âm nhạc – ánh sáng – năng lượng.  
    Không gian nightlife nơi mọi cảm xúc bùng nổ mỗi đêm.
  </p>
</section>

<script src="./js/main.js"></script>
</body>
</html>
