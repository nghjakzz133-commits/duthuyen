<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EMPIRE Club Quận 1 | Flagship Nightlife</title>
  <meta name="description" content="EMPIRE Club Quận 1 – nightlife cao cấp tại trung tâm Sài Gòn." />

  <link rel="stylesheet" href="./css/core.css">
  <link rel="stylesheet" href="./css/global.css">
</head>

<body class="lang-vi">

<!-- ========== FIXED TOP STACK (LOGO + HEADER) ========== -->
<div class="top-stack">

  <!-- HEADER -->
  <header class="site-header">
    <button class="menu-toggle" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="lang-switch">
      <button data-lang-switch="vi" class="active">VI</button>
      <button data-lang-switch="en">EN</button>
    </div>
  </header>

  <!-- LOGO STAGE -->
  <div class="logo-stage" id="home">
    <img
      src="./assets/images/D653A195-74D9-4555-B2C9-3D0C6AB2F131.png"
      alt="EMPIRE Logo"
    />
  </div>

</div>

<!-- ========== HERO VIDEO ========== -->
<section class="hero hero-video">
  <video
    class="hero-bg"
    autoplay
    muted
    loop
    playsinline
  >
    <source src="./assets/video/empire-hero.mp4" type="video/mp4">
  </video>

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <p class="hero-subtitle">
      Biểu tượng nightlife cao cấp tại Sài Gòn
    </p>

    <div class="hero-actions">
      <a href="#contact" class="btn btn-primary">Đặt bàn ngay</a>
      <a href="#experience" class="btn btn-secondary">Khám phá</a>
    </div>
  </div>
</section>

<!-- ========== ABOUT (TEST CONTENT) ========== -->
<section id="about" style="padding:120px 8%; background:#000; color:#fff;">
  <h2>Về EMPIRE</h2>
  <p>
    EMPIRE là club hàng đầu Quận 1, nơi hội tụ âm nhạc, ánh sáng
    và năng lượng nightlife đỉnh cao.
  </p>
</section>

<script src="./js/main.js"></script>
</body>
</html>
