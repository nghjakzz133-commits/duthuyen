<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMPIRE Club | Flagship Nightlife</title>

  <link rel="stylesheet" href="./css/core.css">
  <link rel="stylesheet" href="./css/global.css">
</head>
<body class="lang-vi">

<!-- HEADER -->
<header class="site-header">
  <div class="header-left">
    <button class="menu-toggle">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="header-center">
    <img src="./assets/images/D653A195-74D9-4555-B2C9-3D0C6AB2F131.png" alt="EMPIRE Logo" class="header-logo">
  </div>

  <div class="header-right">
    <button data-lang-switch="vi" class="active">VI</button>
<button data-lang-switch="en">EN</button>
  </div>
</header>
<nav class="main-nav">
  <a href="#home" data-lang="vi">Trang chủ</a>
  <a href="#experience" data-lang="vi">Trải nghiệm</a>
  <a href="#contact" data-lang="vi">Liên hệ</a>

  <a href="#home" data-lang="en">Home</a>
  <a href="#experience" data-lang="en">Experience</a>
  <a href="#contact" data-lang="en">Contact</a>
</nav>
<!-- HERO VIDEO -->
<section class="hero">
  <video autoplay muted loop playsinline class="hero-video">
    <source src="./assets/video/hero.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <p class="hero-text" data-lang="vi">
      Biểu tượng nightlife cao cấp tại Sài Gòn
    </p>
    <p class="hero-text" data-lang="en">
      Saigon’s premium nightlife destination
    </p>

    <div class="hero-actions">
      <a href="#contact" class="btn primary">Đặt bàn</a>
      <a href="#experience" class="btn ghost">Khám phá</a>
    </div>
  </div>
</section>

<!-- ABOUT -->
<section class="about" id="experience">
  <h2>Empire Experience</h2>
  <p>
    Âm nhạc – ánh sáng – năng lượng.  
    Không gian nightlife đỉnh cao mỗi đêm.
  </p>
</section>

<script src="./js/main.js"></script>
</body>
</html>
