<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EMPIRE Club Quận 1 | Flagship Nightlife</title>
  <meta name="description" content="EMPIRE Club Quận 1 – nightlife cao cấp tại trung tâm Sài Gòn." />

  <link rel="stylesheet" href="./css/core.css">
  <link rel="stylesheet" href="./css/global.css">
</head>

<body class="lang-vi">

<!-- ========== HEADER (CHỈ MENU + LANG) ========== -->
<header class="site-header">
  <div class="container header-inner">

    <!-- MENU LEFT -->
    <button class="menu-toggle" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- LANG RIGHT -->
    <div class="lang-switch">
      <button data-lang-switch="vi" class="active">VI</button>
      <button data-lang-switch="en">EN</button>
    </div>

  </div>

  <!-- MOBILE NAV -->
  <nav class="main-nav">
    <a href="#home" data-lang="vi">Trang chủ</a>
    <a href="#about" data-lang="vi">Giới thiệu</a>
    <a href="#experience" data-lang="vi">Trải nghiệm</a>
    <a href="#combo" data-lang="vi">Combo</a>
    <a href="#tables" data-lang="vi">Đặt bàn</a>
    <a href="#contact" data-lang="vi">Liên hệ</a>

    <a href="#home" data-lang="en">Home</a>
    <a href="#about" data-lang="en">About</a>
    <a href="#experience" data-lang="en">Experience</a>
    <a href="#combo" data-lang="en">Combos</a>
    <a href="#tables" data-lang="en">Tables</a>
    <a href="#contact" data-lang="en">Contact</a>
  </nav>
</header>

<!-- ========== LOGO STAGE (TÁCH RIÊNG) ========== -->
<section class="brand-hero" id="home">
  <img
    src="./assets/images/D653A195-74D9-4555-B2C9-3D0C6AB2F131.png"
    alt="EMPIRE Logo"
  />
  <p class="brand-tagline">
    Biểu tượng nightlife cao cấp tại Sài Gòn
  </p>
</section>
<!-- ========== hero STAGE (TÁCH RIÊNG) ========== -->
<section class="hero hero-video">
  <video
    class="hero-bg"
    autoplay
    muted
    loop
    playsinline
  >
    <source src="./assets/video/empire-hero.mp4" type="video/mp4">
  </video>

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <p class="hero-subtitle">
      Nơi nightlife Sài Gòn bùng nổ mỗi đêm
    </p>

    <div class="hero-actions">
      <a href="#contact" class="btn btn-primary">Đặt bàn ngay</a>
      <a href="#experience" class="btn btn-secondary">Khám phá</a>
    </div>
  </div>
</section>

<script src="./js/main.js"></script>
</body>
</html>
